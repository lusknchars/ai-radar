name: radar

on:
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC = 06:00 em Brasilia
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rodar sem enviar o push'
        type: boolean
        default: false

permissions:
  contents: write            # necessario para commitar o db e o markdown
  pages: write               # publicar o jornal
  id-token: write            # exigido pelo deploy-pages

concurrency:
  group: radar-state
  # Serializa execucoes: duas em paralelo (por exemplo um dispatch manual
  # durante o run agendado) brigariam no `git push` sobre os mesmos arquivos.
  # NAO e para preservar estado parcial -- o runner e efemero, e nada em
  # o banco configurado sobrevive a ele ate ser commitado e empurrado. Um run
  # cancelado nao perde nada duravel.
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      site_ready: ${{ steps.site_status.outputs.ready }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar
        run: pip install -e .

      - name: Rodar o radar
        env:
          RADAR_DB:            ${{ vars.RADAR_DB || 'data/radar-state.db' }}
          RADAR_LLM_PROVIDER:  ${{ vars.RADAR_LLM_PROVIDER || 'kimi' }}
          RADAR_MODEL:         ${{ vars.RADAR_MODEL }}
          RADAR_KIMI_BASE_URL: ${{ vars.RADAR_KIMI_BASE_URL }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          KIMI_API_KEY:        ${{ secrets.KIMI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN:           ${{ github.token }}
        run: |
          python scripts/run_workflow.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commitar estado e digest
        # `always()` de proposito: quando o passo anterior falha, o markdown do
        # dia ja esta escrito e o lote do LLM ja foi pago. Sem isto os dois vao
        # embora com o runner efemero, e o dia inteiro se perde por causa de uma
        # falha de entrega no ultimo metro.
        # !cancelled() e nao always(): always() commita ate num run
        # cancelado. Queremos preservar o digest quando o passo
        # anterior falha, nao quando alguem aborta de proposito.
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # data/ e radar/ existem no checkout. site/ so existe depois que a
          # publicacao termina; passar um pathspec ausente faz git add sair
          # 128 e esconder a falha original do radar.
          git add -A -- data radar
          if test -d site; then git add -A -- site; fi
          git diff --staged --quiet || git commit -m "radar: digest de $(date -u +%F)"
          git push

      - name: Verificar artefato do jornal
        id: site_status
        if: ${{ !cancelled() }}
        run: |
          if test -f site/index.html; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Empacotar o jornal
        if: ${{ !cancelled() && steps.site_status.outputs.ready == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publicar:
    # Job separado porque `deploy-pages` exige um environment proprio, e
    # declarar environment no job que faz `git push` prenderia o commit do
    # digest a uma aprovacao de deploy.
    needs: run
    if: ${{ always() && !cancelled() && needs.run.outputs.site_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
