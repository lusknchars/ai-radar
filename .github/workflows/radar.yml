name: radar

on:
  schedule:
    - cron: '17 9 * * *'     # Daily 09:17 UTC / 06:17 Brasilia, including Exa when configured.
  workflow_dispatch:
    inputs:
      profile:
        description: 'Expanded: up to 60 briefs, six Exa searches and three deep reports'
        type: choice
        options: [daily, expanded]
        default: daily
      dry_run:
        description: 'Rodar sem enviar o push'
        type: boolean
        default: false
      exa_mode:
        description: 'Exa discovery frequency (requires EXA_API_KEY)'
        type: choice
        options: [daily, weekly, off]
        default: daily

permissions:
  contents: write            # necessario para commitar o db e o markdown
  pages: write               # publicar o jornal
  id-token: write            # exigido pelo deploy-pages

concurrency:
  group: radar-state
  # Serializa execucoes: duas em paralelo (por exemplo um dispatch manual
  # durante o run agendado) brigariam no `git push` sobre os mesmos arquivos.
  # NAO e para preservar estado parcial -- o runner e efemero, e nada em
  # o banco configurado sobrevive a ele ate ser commitado e empurrado. Um run
  # cancelado nao perde nada duravel.
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: kimi
    timeout-minutes: ${{ inputs.profile == 'expanded' && 120 || 45 }}
    outputs:
      site_ready: ${{ steps.site_status.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Resolve the branch when this serialized job starts, including
          # state committed by the preceding collector.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar
        run: pip install -e .

      - name: Rodar o radar
        id: collect
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          RADAR_DB:            ${{ vars.RADAR_DB || 'data/radar-state.db' }}
          RADAR_COLLECTION_MODE: ${{ vars.RADAR_COLLECTION_MODE || 'auto' }}
          RADAR_EXA_MODE:      ${{ inputs.exa_mode || vars.RADAR_EXA_MODE || 'daily' }}
          RADAR_EXA_RESULTS:   ${{ inputs.profile == 'expanded' && '15' || vars.RADAR_EXA_RESULTS || '10' }}
          RADAR_EXA_QUERIES:   ${{ inputs.profile == 'expanded' && '3' || '1' }}
          RADAR_EXA_LOOKBACK_DAYS: ${{ inputs.profile == 'expanded' && '90' || '30' }}
          EXA_API_KEY:         ${{ secrets.EXA_API_KEY }}
          RADAR_MAX_NEW_PER_SCOPE: ${{ inputs.profile == 'expanded' && '30' || vars.RADAR_MAX_NEW_PER_SCOPE || '20' }}
          RADAR_MAX_EQUATIONS_PER_RUN: ${{ vars.RADAR_MAX_EQUATIONS_PER_RUN || '5' }}
          RADAR_SUBSCRIBE_URL: ${{ vars.RADAR_SUBSCRIBE_URL }}
          RADAR_LLM_PROVIDER:  ${{ vars.RADAR_LLM_PROVIDER || 'kimi' }}
          RADAR_MODEL:         ${{ vars.RADAR_MODEL }}
          RADAR_KIMI_BASE_URL: ${{ vars.RADAR_KIMI_BASE_URL }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          KIMI_API_KEY:        ${{ secrets.KIMI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN:           ${{ github.token }}
        run: |
          python scripts/run_workflow.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Require usable collection output
        if: ${{ !cancelled() && steps.collect.outcome == 'failure' && steps.collect.outputs.publication_ready != 'true' }}
        run: |
          echo "::error::Collection failed before producing a usable publication. Saved state will still be committed."
          exit 1

      - name: Report partial collection
        if: ${{ !cancelled() && steps.collect.outputs.collection_outcome == 'partial' }}
        run: |
          echo "::warning::Discovery was incomplete. Publishing available papers with partial status in collection.json."
          echo "Discovery was partial. Available papers can be read, but collection coverage is incomplete." >> "$GITHUB_STEP_SUMMARY"

      - name: Read selected full papers
        id: deepen
        if: ${{ success() && !inputs.dry_run && inputs.profile == 'expanded' && (steps.collect.outputs.collection_outcome == 'success' || steps.collect.outputs.collection_outcome == 'partial') }}
        continue-on-error: true
        env:
          RADAR_DB: ${{ vars.RADAR_DB || 'data/radar-state.db' }}
          RADAR_LLM_PROVIDER: kimi
          RADAR_MODEL: ${{ vars.RADAR_MODEL }}
          RADAR_FORMULA_MODEL: ${{ vars.RADAR_FORMULA_MODEL }}
          RADAR_KIMI_BASE_URL: ${{ vars.RADAR_KIMI_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: python scripts/deepen_shortlist.py --db "$RADAR_DB" --limit 3

      - name: Preserve completed deep reports
        if: ${{ !cancelled() && inputs.profile == 'expanded' }}
        uses: actions/upload-artifact@v7
        with:
          name: research-round-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore

      - name: Report partial analysis
        if: ${{ !cancelled() && steps.deepen.outcome == 'failure' }}
        run: |
          echo "::warning::Some full-paper reports failed. Completed reports are preserved; missing evidence remains unknown."
          echo "Full-paper analysis is incomplete. Inspect the report artifact for failures." >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh paper previews and publication
        if: ${{ success() && !inputs.dry_run }}
        env:
          RADAR_DB: ${{ vars.RADAR_DB || 'data/radar-state.db' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          if ! python scripts/build_paper_previews.py; then
            echo "::warning::Some paper previews are unavailable; original PDF links remain available."
          fi
          python scripts/publish_public_research.py --db "$RADAR_DB" --as-of "$(date -u +%F)"

      - name: Commitar estado e digest
        # `always()` de proposito: quando o passo anterior falha, o markdown do
        # dia ja esta escrito e o lote do LLM ja foi pago. Sem isto os dois vao
        # embora com o runner efemero, e o dia inteiro se perde por causa de uma
        # falha de entrega no ultimo metro.
        # !cancelled() e nao always(): always() commita ate num run
        # cancelado. Queremos preservar o digest quando o passo
        # anterior falha, nao quando alguem aborta de proposito.
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # data/ e radar/ existem no checkout. site/ so existe depois que a
          # publicacao termina; passar um pathspec ausente faz git add sair
          # 128 e esconder a falha original do radar.
          git add -A -- data radar
          if test -d site; then git add -A -- site; fi
          if test -d assets/paper-previews; then git add -A -- assets/paper-previews; fi
          if test -d reports; then git add -A -- reports; fi
          git diff --staged --quiet || git commit -m "radar: digest de $(date -u +%F)"
          git push

      - name: Publish to Vercel when configured
        if: ${{ success() && !inputs.dry_run }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"; then
            npx --yes vercel@54.12.2 deploy --prod --yes --token "$VERCEL_TOKEN"
          else
            echo "Vercel automatic deployment is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verificar artefato do jornal
        id: site_status
        if: ${{ !cancelled() }}
        run: |
          if test -f site/index.html; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Empacotar o jornal
        if: ${{ !cancelled() && steps.site_status.outputs.ready == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publicar:
    # Job separado porque `deploy-pages` exige um environment proprio, e
    # declarar environment no job que faz `git push` prenderia o commit do
    # digest a uma aprovacao de deploy.
    needs: run
    if: ${{ always() && !cancelled() && needs.run.outputs.site_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
