name: radar

on:
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC = 06:00 em Brasilia
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rodar sem enviar o push'
        type: boolean
        default: false

permissions:
  contents: write            # necessario para commitar o db e o markdown
  pages: write               # publicar o jornal
  id-token: write            # exigido pelo deploy-pages

concurrency:
  group: radar
  # Serializa execucoes: duas em paralelo (por exemplo um dispatch manual
  # durante o run agendado) brigariam no `git push` sobre os mesmos arquivos.
  # NAO e para preservar estado parcial -- o runner e efemero, e nada em
  # data/radar.db sobrevive a ele ate ser commitado e empurrado. Um run
  # cancelado nao perde nada duravel.
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar
        run: pip install -e .

      - name: Rodar o radar
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN:           ${{ secrets.GH_TOKEN }}
        run: |
          python -m radar.cli ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commitar estado e digest
        # `always()` de proposito: quando o passo anterior falha, o markdown do
        # dia ja esta escrito e o lote do LLM ja foi pago. Sem isto os dois vao
        # embora com o runner efemero, e o dia inteiro se perde por causa de uma
        # falha de entrega no ultimo metro.
        # !cancelled() e nao always(): always() commita ate num run
        # cancelado. Queremos preservar o digest quando o passo
        # anterior falha, nao quando alguem aborta de proposito.
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # `-A -- data radar` em vez de nomear data/radar.db: no primeiro
          # ensaio com --dry-run o banco vive num diretorio temporario e o
          # arquivo nao existe aqui, e nomear um pathspec inexistente faz o
          # git sair 128 e o passo inteiro falhar -- levando junto o digest
          # que ja tinha sido escrito. `mkdir -p` NAO resolve: cria o
          # diretorio, nao o arquivo. Esta forma estagia o que existir.
          git add -A -- data radar site
          git diff --staged --quiet || git commit -m "radar: digest de $(date -u +%F)"
          git push

      - name: Empacotar o jornal
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    # Job separado porque `deploy-pages` exige um environment proprio, e
    # declarar environment no job que faz `git push` prenderia o commit do
    # digest a uma aprovacao de deploy.
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
