[project]
name = "radar"
version = "0.1.0"
requires-python = ">=3.12"
# O piso do anthropic e a linha 1.x porque e a que o codigo realmente usa:
# `messages.parse`, `output_config` (format e effort) e o Batch API com
# `MessageCreateParamsNonStreaming`. Um piso de 0.40 documentava uma
# compatibilidade que nao existe -- a instalacao passaria e a primeira
# chamada quebraria.
dependencies = [
    "httpx>=0.27",
    "anthropic>=1.0,<2",
    "pydantic>=2.7",
    "pypdf>=5,<7",
    "python-dotenv>=1,<2",
]

[project.scripts]
ai-radar = "radar.cli:main"
ai-radar-doctor = "radar.doctor:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
documents = ["docling==2.124.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
